# THE OLD QA SCRIPTS (scripts/qa until 2026-10-14), moved into qa/tests/<suite>/ — nothing deleted.
# qa/tests/legacy.spec.ts runs every `live` entry as one Playwright test, tagged with its suite and
# @legacy, so its verdict lands in raw.json beside the new suites. Classification of 2026-10-14
# (each import, route and selector checked against src/; see the report's migration table).
#
#   kind    check   — tsx, no browser; exit code is the verdict (most write only throwaway orgs)
#           node    — plain node script with its own pass/fail exit code
#           page    — Playwright page pass against the dev server, signs in as qa@acme.test, QA Co only
#           prod    — drives a browser over its own production build (scripts start it; minutes)
#   status  live · dup (covered by `by`, kept in _archive) · dead (_archive) · manual (needs the
#           network or a paid key — not run by the suite; run by hand) · tool (no assertions; qa/tools)
#   seed    a script run `up` before and `down` after
#   minutes the test's time limit (default 5)
defaults: { minutes: 5 }
