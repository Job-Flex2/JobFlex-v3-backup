# Confirmed false positives and known, accepted failures. The analysis does not show a finding
# that matches an entry here; it counts it on one line of the summary ("known: N") instead.
#
# An entry matches a finding when EVERY field given matches (regex, case-insensitive):
#   signature — the finding's id or its signature (shown in the report under "Откуда это известно")
#   message   — the original error text
#   test      — a test title
#   route     — a page path
# Always say why it is not (or not now) a defect and who confirmed it, with a date.
issues:
  - id: fence-3d-ground-known
    signature: "^legacy qa/tests/logic/fence-3d-ground\\.check\\.ts$"
    why: "four checks (steps per bay, step post panel, 3D steps = priced steps, corner post) fail since before 2026-10-06 (fence engine d2578453) — known, not a regression"
    confirmed: "owner, 2026-10-15"
  - id: fence-terrain-known
    signature: "^legacy qa/tests/logic/fence-terrain-check\\.ts$"
    why: "the valley case fails since before 2026-10-06 — known, not a regression"
    confirmed: "owner, 2026-10-15"
  - id: admin-subscription-stripe-test-mode
    signature: "^legacy qa/tests/billing/admin-subscription\\.check\\.ts$"
    why: "conflicts with dev.db stripe:mode=test — its Stripe mock / price ids do not match the sandbox account (No such price…)"
    confirmed: "owner, 2026-10-15"
  - id: google-client-id-empty-locally
    test: "Google is offered on sign-up and sign-in"
    message: "client id"
    why: "GOOGLE_CLIENT_ID is empty in the local .env, so the Google URL carries client_id=\"\" — environment, not code"
    confirmed: "owner, 2026-10-15"
  # Old page scripts checked one by one on a live server, 2026-10-15 — each fails the same way twice,
  # and each failure is the script's out-of-date expectation, not the product:
  - id: reports-test-quarter-first-month
    signature: '^legacy qa/tests/pages/reports-test\.js$'
    why: "\"sheet recomputes on switch\" assumes Quarter differs from This month; in the first month of a quarter (Oct, Jan, Apr, Jul) Quarter = quarter-to-date = this month (src/actions/reports.ts) — calendar-dependent test"
    confirmed: "QA Lab, 2026-10-15"
  - id: roof-test-pitch-label-and-old-row
    signature: '^legacy qa/tests/pages/roof-test\.js$'
    why: "the hero's \"Predominant pitch\" is now \"Roof pitch\" (the script reads the old label → empty pitch), and QA Co holds an older 12629 NE 100th Pl measurement (Oct 7) besides the seeded one, so \"listed exactly once\" sees 2 rows"
    confirmed: "QA Lab, 2026-10-15"
  - id: sub-test-custom-plan-off
    signature: '^legacy qa/tests/pages/sub-test\.js$'
    why: "expects the Build-your-plan (custom) card; the server under test runs without CUSTOM_PLAN_ENABLED=true, so the card is rightly absent"
    confirmed: "QA Lab, 2026-10-15"
  - id: fence-test-price-book-link
    signature: '^legacy qa/tests/pages/fence-test\.js$'
    why: "expects the price-book link /dashboard/inventory?trade=fence; it now goes to the fence's own inventory, /dashboard/fence-estimator/inventory#book"
    confirmed: "QA Lab, 2026-10-15"
  - id: fence-tiers-test-two-tier-ladder
    signature: '^legacy qa/tests/pages/fence-tiers-test\.js$'
    why: "clicks Best for every fence type; for composite-privacy the ladder drops a tier that would quote the same fence as Better (fence-estimator-behavior renderTiers), so there is no Best to click"
    confirmed: "QA Lab, 2026-10-15"

  # ── Folded, not hidden (fold: true, 2026-10-17) ─────────────────────────────────────────────
  # Old, known or noise: shown at the bottom of the report under "Старое, известное и шум", out of
  # the headline counts. `onlyTests` (regex): EVERY test of the finding must match — a new test of
  # another role that hits the same cause un-folds it.
  - id: v3-prototypes-layout
    fold: true
    signature: "^layout /v3/"
    why: "/v3/* are the old design prototypes (calendar-a, manual-builder-a, workers-new), not pages a customer opens"
    confirmed: "owner, 2026-10-17"
  - id: crm-sandboxed-frame-console
    fold: true
    message: "Blocked script execution in 'about:(blank|srcdoc)' because the document's frame is sandboxed"
    why: "the email preview is a sandboxed iframe on purpose; Chrome logs that its scripts stay off — no defect"
    confirmed: "owner, 2026-10-17"
  - id: stripe-checkout-401
    fold: true
    message: "^Failed to load resource: the server responded with a status of 401"
    onlyTests: "test card|annual|monthly|custom plan|Checkout"
    why: "a request of Stripe's own Checkout page (third party) answers 401 in test mode; our server is not involved"
    confirmed: "owner, 2026-10-17"
  - id: platform-admin-without-company
    fold: true
    signature: '^root NoOrgError @ resolveOrg$|^console Failed to load resource: the server responded with a status of # \(Internal Server Error\)$'
    onlyTests: " as admin @"
    why: "a platform admin with no company of their own opens the company dashboard: NoOrgError → 500. Known (2026-10-14), only the platform admin is affected"
    confirmed: "owner, 2026-10-17"
  - id: admin-live-pages-look
    fold: true
    signature: '^visual '
    route: '^/admin/(traffic|activity|ab-testing|revenue)'
    why: "the admin's analytics pages (/admin/traffic, /activity, /ab-testing, /revenue) draw live numbers — page views, sign-ups, experiment visitors, revenue — that every QA run itself changes; their picture can not be steady"
    confirmed: "QA Lab, 2026-10-17"
